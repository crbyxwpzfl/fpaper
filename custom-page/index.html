<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />

    <title>Web Console & Image Dither</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style type="text/css">
        /* --- webserial.html styles --- */
        div { display: block; }
        a { margin: 0rem; text-decoration: none; }
        *, ::after, ::before { box-sizing: inherit; }
        p { margin: 0 0 1rem; }
        body { overscroll-behavior: none; height: 100%; width: 100%; margin: 0; padding: 0; font-family:  -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
        .text-center { text-align: center; }
        .gray { color: #dedede; }
        .shadow {
            /* Keep existing drop-shadow filter for subtle effect and add a stronger box-shadow
               so the terminal panel (which uses class="pannel shadow") gets a visible shadow. */
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.06));
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.233);
            transition: box-shadow 180ms ease, transform 180ms ease;
        }
    .w-full { font-family:  Menlo, monospace; font-size: 10px; width: 100%; }
        .grid { display: grid; }
        .gap-2 { gap: 0.5rem; }
        .flex { display: flex; }
        .grow { font-family:  Menlo; font-size: 20px; flex-grow: 1; }
        .justify-items-end { justify-items: end; }
        .rounded { border-radius: 0.5rem; }
    :root { --terminal-max-width: 960px; --terminal-side-gap: 1rem; }
    .section { box-sizing: border-box; background-color: #ffffff; }
    .main { display: flex; flex-direction: column; justify-content: flex-start; align-items: center; height: 70dvh; padding: 0 var(--terminal-side-gap); }
    .main .pannel { position: relative; border: #ffffff; border-style: solid; border-width: 0.1rem; border-radius: 0.5rem; background-color: #fff; width: 100%; max-width: var(--terminal-max-width); font-size: 10px; margin: 40px auto 0; }
    .pannel button { cursor: pointer; padding: 7px 5px 0px; font-size: 16px; outline-style: none; border: 0px; color: #000000; background-color: rgba(0,103,244,0.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
        .pannel button:disabled { background-color: #f0f0f0; }
    .pannel #record { height:40rem; max-height:40rem; padding: 0.5rem; resize: none; overscroll-behavior: none; background:#ffffff; color:#000000; font-family: Menlo, monospace; font-size:11px; line-height:1.4; overflow-y:auto; white-space:pre-wrap; text-align:left; width:100%; box-sizing:border-box; }
    .pannel #record .terminal-output-line, .pannel #record .prompt-line { text-align:left; }
    .terminal-output-line { white-space: pre-wrap; word-break: break-word; }
    .prompt-line { display:block; }
    /* Serial output lines remain default (black via container); explicitly set for clarity */
    .terminal-output-line { color:#000000; }
    /* Prompt symbol color */
    .prompt { color:#000000; }
    /* User input (current and historical commands) color */
    .prompt-input {  font-size:16px; outline:none; display:inline-block; min-width:1ch; color:#000000; caret-color:#000000; }
    .prompt-input:empty:before { content:"\00a0"; }
    #record:focus { outline:none; }
        #control-button { position: absolute; top: 0.5rem; right: 0.5rem; }
    #control-button button { background-color: rgba(255,255,255,0.15); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }    /* top right corner buttons */
        .alert span { user-select: none; background: #ffe14d; padding: 1px 10px; display: block; color: rgb(212, 32, 32); }
        .footer { padding: 1rem 0.5rem; background-color: rgb(255, 255, 255); }
        .copyright { padding-bottom: 1rem; }
        .float-left { float: left; }
        .float-right { float: right; }
        /* --- overlay styles --- */
        #imgOverlayBg {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0; width: 100vw; height: 100vh;
            /* background: rgba(0,0,0,0.6); */
            background: rgba(0, 0, 0, 0.075);
            justify-content: center;
            align-items: center;
        }
        #imgOverlay {
            position: relative;
            background: none;
            border-radius: 1.5rem;
            overflow: visible;
            box-shadow: 0 0 32px 8px rgba(0,0,0,0.2);
            /*max-width: 90vw;
            height: 90vh;
            object-fit: contain;*/
            width: 70vw;
            max-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #imgRegionContainer {
            position: relative;
            display: inline-block;
            background: none;
        }
        #popupImage {
            display: block;
            max-width: 90vw;
            /*max-height: 90vh;
            width: auto;
            height: auto;
            object-fit: contain*/
            width: 70vw;
            max-height: 70vh;
            border-radius: 1.5rem;
            background: #fff;
        }
        #region {
            position: absolute;
            cursor: move;
            box-sizing: border-box;
            display: none;
            touch-action: none;
            border: 2px dashed rgb(0, 0, 0);
            border-radius: 0.5rem;
        }
        #ditheredOverlay {
            position: absolute;
            left: 0; top: 0;
            display: none;
            pointer-events: none;
            border-radius: 0.5rem;
        }
        #peerButtonsContainer {
            position: absolute;
            z-index: 10;
            display: none;
            flex-direction: row;
            gap: 0.35rem;
            width: auto;
            height: auto;
            min-width: 1px;
            min-height: 1px;
            transform: none;
            pointer-events: auto;
        }
        
        .peer-btn {
            background: rgba(255, 255, 255, 0.52);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: #000000;
            border: none;
            border-radius: 0.55rem;
            padding: 0.45rem 0.7rem;
            font-size: 0.85rem;
            line-height: 1;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            cursor: pointer;
            white-space: nowrap;
            width: auto;
            height: auto;
            transform: none;
        }
        
        .peer-btn:hover {
            background: #0000007f;
        }

        /* 
        @media (max-width: 600px) {
            #popupImage { max-width: 98vw; max-height: 60vh; }
        }
        */

    </style>

    <script>
    // ...existing code from webserial.html for WebSocket, terminal, etc...
    let gateway = `ws://${window.location.host + window.location.pathname}ws`;
    let websocket;
    let textArea = document.getElementById("record");
    let enableFlowLock = false;
    let enableTimestamp = false;
    let pingTimeout;
    let connectTimeout;
    let commandHistory = [];
    let commandHistoryIdx = 0;
    let promptContainer = null;
    let inputSpan = null;
    const PROMPT_SYMBOL = '> ';
    function removeLogo() {
        document.getElementById("logo").remove();
        document.getElementById("title").style.display = "block";
    }
    function initWebPage() {
        initCommandHistory();
        initWebSocket();
        initTerminalUI();
        // Image button
        document.getElementById('img-button').addEventListener('click', function() {
            // Open file chooser immediately for responsiveness (esp. mobile Safari)
            document.getElementById('imgInput').click();
            // Refresh slots in background (buttons update after image chosen)
            querySlots();
        });
        document.getElementById('imgInput').addEventListener('change', handleImageFile);
        // Prime slots in background so first click is fast
        querySlots();
    }
    function initCommandHistory() {
        const json = localStorage.history;
        commandHistory = json ? JSON.parse(json) : [];
        commandHistoryIdx = commandHistory.length;
    }
    function initWebSocket() {
        clearTimeout(connectTimeout);
        clearTimeout(pingTimeout);
        pingTimeout = false;
        connectTimeout = setTimeout(() => {
            terminalWrite("search timeout");
            websocket.close();
            initWebSocket();
        }, 3000);
        terminalWrite("please wait while searching.... ");
        websocket = new WebSocket(gateway);
        websocket.onopen = onOpen;
        websocket.onclose = onClose;
        websocket.onmessage = onMessage;
        websocket.onerror = onError;
    }
    function initTerminalUI(){
        textArea.setAttribute('contenteditable','false');
        createPrompt();
        textArea.addEventListener('keydown', terminalKeyHandler);
        textArea.addEventListener('click', ensureCaretAtInputEnd);
    }
    function createPrompt(){
        promptContainer = document.createElement('div');
        promptContainer.className = 'prompt-line';
        const promptSpan = document.createElement('span');
        promptSpan.className = 'prompt';
        promptSpan.textContent = PROMPT_SYMBOL;
        inputSpan = document.createElement('span');
        inputSpan.className = 'prompt-input';
        inputSpan.setAttribute('contenteditable','true');
        promptContainer.appendChild(promptSpan);
        promptContainer.appendChild(inputSpan);
        textArea.appendChild(promptContainer);
        focusInputEnd();
        scrollTerminalBottom();
    }
    function focusInputEnd(){
        if(!inputSpan) return;
        const range = document.createRange();
        range.selectNodeContents(inputSpan);
        range.collapse(false);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
    }
    function ensureCaretAtInputEnd(){
        if(!inputSpan) return;
        if(!promptContainer.contains(document.activeElement)){
            focusInputEnd();
        }
    }
    function terminalKeyHandler(e){
        if(!inputSpan) return;
        const key = e.key;
        if(key === 'Enter'){
            e.preventDefault();
            const cmd = inputSpan.textContent.trim();
            executeCommand(cmd);
            return;
        }
        if(key === 'ArrowUp'){
            e.preventDefault();
            if(commandHistory.length){
                commandHistoryIdx = (commandHistoryIdx - 1 + commandHistory.length) % commandHistory.length;
                inputSpan.textContent = commandHistory[commandHistoryIdx];
                focusInputEnd();
            }
        } else if(key === 'ArrowDown'){
            e.preventDefault();
            if(commandHistory.length){
                commandHistoryIdx = (commandHistoryIdx + 1) % commandHistory.length;
                inputSpan.textContent = commandHistory[commandHistoryIdx];
                focusInputEnd();
            }
        }
    }
    function executeCommand(cmd){
        if(cmd.length){
            console.log('send command: ', cmd);
            websocket && websocket.readyState === WebSocket.OPEN && websocket.send(cmd);
            commandHistory.push(cmd);
            if (commandHistory.length > 50) {
                commandHistory.splice(0, commandHistory.length - 50);
            }
            commandHistoryIdx = commandHistory.length;
            localStorage.history = JSON.stringify(commandHistory);
        }
        inputSpan.setAttribute('contenteditable','false');
        inputSpan = null;
        createPrompt();
    }
    function scrollTerminalBottom(){
        if(!enableFlowLock){
            textArea.scrollTop = textArea.scrollHeight;
        }
    }
    function onOpen(event) {
        clearTimeout(connectTimeout);
        terminalWrite("found portal try 'help' for configuration");
        focusInputEnd();
    }
    function onError(e) {
        console.log("Error!", e);
        websocket.close();
    }
    function onClose(e) {
        console.log("connection closed.", e);
    }
    function onMessage(event) {
        if (event.data == 'pong') {
            clearTimeout(pingTimeout);
            pingTimeout = false;
        } else {
            terminalWrite(event.data);
        }
    }
    function terminalWrite(raw) {
        if(Array.isArray(raw)) raw = raw.join('\n');
        if(raw.endsWith('\n')) raw = raw.slice(0,-1);
        const lines = raw.split(/\n/);
        lines.forEach(line => {
            const div = document.createElement('div');
            div.className = 'terminal-output-line';
            if(enableTimestamp && line.trim().length){
                div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + line;
            } else {
                div.textContent = line;
            }
            if(promptContainer) textArea.insertBefore(div, promptContainer); else textArea.appendChild(div);
        });
        scrollTerminalBottom();
    }
    function terminalClean() {
        textArea.innerHTML = '';
        promptContainer = null; inputSpan = null;
        createPrompt();
    }
    // sendCommand replaced by inline prompt handler
    setInterval(() => {
        if (!pingTimeout && websocket.readyState == WebSocket.OPEN) {
            pingTimeout = setTimeout(() => {
                terminalWrite("Ping timeout.");
                websocket.close();
                initWebSocket();
            }, 3000);
            websocket.send("ping");
        }
    }, 2000);
    window.addEventListener("DOMContentLoaded", function () {
        initWebPage();
    }, false);

    function dithering(ctx, width, height, threshold, typeIndex) {
    const type = ['binary', 'bayer', 'floydsteinberg', 'atkinson'][typeIndex];
    const bayerThresholdMap = [
        [15, 135, 45, 165],
        [195, 75, 225, 105],
        [60, 180, 30, 150],
        [240, 120, 210, 90],
    ];

    const lumR = [];
    const lumG = [];
    const lumB = [];
    for (let i = 0; i < 256; i++) {
        lumR[i] = i * 0.299;
        lumG[i] = i * 0.587;
        lumB[i] = i * 0.114;
    }
    const imageData = ctx.getImageData(0, 0, width, height);

    const imageDataLength = imageData.data.length;

    // Greyscale luminance (sets r pixels to luminance of rgb)
    for (let i = 0; i <= imageDataLength; i += 4) {
        imageData.data[i] =
        Math.floor(lumR[imageData.data[i]] + lumG[imageData.data[i + 1]] + lumB[imageData.data[i + 2]]);
    }

    const w = imageData.width;
    let newPixel; let
        err;

    for (let currentPixel = 0; currentPixel <= imageDataLength; currentPixel += 4) {
        if (type === 'binary') {
        // No dithering
        imageData.data[currentPixel] = imageData.data[currentPixel] < threshold ? 0 : 255;
        } else if (type === 'bayer') {
        // 4x4 Bayer ordered dithering algorithm
        // eslint-disable-next-line no-mixed-operators
        const x = currentPixel / 4 % w;
        const y = Math.floor(currentPixel / 4 / w);
        const map = Math.floor((imageData.data[currentPixel] + bayerThresholdMap[x % 4][y % 4]) / 2);
        imageData.data[currentPixel] = (map < threshold) ? 0 : 255;
        } else if (type === 'floydsteinberg') {
        // Floydaâ‚¬"Steinberg dithering algorithm
        newPixel = imageData.data[currentPixel] < 129 ? 0 : 255;
        err = Math.floor((imageData.data[currentPixel] - newPixel) / 16);
        imageData.data[currentPixel] = newPixel;

        imageData.data[currentPixel + 4] += err * 7;
        imageData.data[currentPixel + 4 * w - 4] += err * 3;
        imageData.data[currentPixel + 4 * w] += err * 5;
        imageData.data[currentPixel + 4 * w + 4] += err * 1;
        } else if (type === 'atkinson') {
        // Bill Atkinson's dithering algorithm
        newPixel = imageData.data[currentPixel] < threshold ? 0 : 255;
        err = Math.floor((imageData.data[currentPixel] - newPixel) / 8);
        imageData.data[currentPixel] = newPixel;

        imageData.data[currentPixel + 4] += err;
        imageData.data[currentPixel + 8] += err;
        imageData.data[currentPixel + 4 * w - 4] += err;
        imageData.data[currentPixel + 4 * w] += err;
        imageData.data[currentPixel + 4 * w + 4] += err;
        imageData.data[currentPixel + 8 * w] += err;
        } else {
        console.error(`unknown dithering type requested: ${type}`);
        }

        // Set g and b pixels equal to r
        imageData.data[currentPixel + 1] = imageData.data[currentPixel + 2] = imageData.data[currentPixel];
    }

    ctx.putImageData(imageData, 0, 0);
    }

    function canvas2bytes(canvas, type = 'bw') {
        const ctx = canvas.getContext('2d');
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        const arr = [];
        let buffer = [];
        // Scan in row-major order (left->right, top->bottom) so pixel i maps to bitIndex=i (y*width+x)
        // This matches the ESP32 side which accesses bits with bitIndex = y*srcW + x and mask 0x80>>(bitIndex%8)
        // Each group of 8 pushed bits forms one byte with the first bit as MSB (bit7) as expected by the decoder.
        for (let y = 0; y < canvas.height; y++) {
            for (let x = 0; x < canvas.width; x++) {
                const index = (canvas.width * 4 * y) + x * 4;
                const isOn = (type !== 'bwr')
                    ? (imageData.data[index] > 0 && imageData.data[index + 1] > 0 && imageData.data[index + 2] > 0)
                    : (imageData.data[index] > 0 && imageData.data[index + 1] === 0 && imageData.data[index + 2] === 0);
                buffer.push(isOn ? 1 : 0);
                if (buffer.length === 8) {
                    arr.push(parseInt(buffer.join(''), 2));
                    buffer = [];
                }
            }
        }
        // Flush remaining bits if image width*height not multiple of 8 (shouldn't happen for 400x300 but keep for safety)
        if (buffer.length) {
            while (buffer.length < 8) buffer.push(0); // pad with 0 (black)
            arr.push(parseInt(buffer.join(''), 2));
        }
        return arr;
    }

    function getColorDistance(rgba1, rgba2) {
        const [r1, b1, g1] = rgba1;
        const [r2, b2, g2] = rgba2;

        const rm = (r1 + r2) / 2;

        const r = r1 - r2;
        const g = g1 - g2;
        const b = b1 - b2;

        return Math.sqrt((2 + rm / 256) * r * r + 4 * g * g + (2 + (255 - rm) / 256) * b * b);
    }

    function getNearColor(pixel, palette) {
        let minDistance = 255 * 255 * 3 + 1;
        let paletteIndex = 0;

        for (let i = 0; i < palette.length; i++) {
            const targetColor = palette[i];
            const distance = getColorDistance(pixel, targetColor);
            if (distance < minDistance) {
            minDistance = distance;
            paletteIndex = i;
            }
        }

        return palette[paletteIndex];
    }

    function getNearColorV2(color, palette) {
        let minDistanceSquared = 255 * 255 + 255 * 255 + 255 * 255 + 1;

        let bestIndex = 0;
        for (let i = 0; i < palette.length; i++) {
            const rdiff = (color[0] & 0xff) - (palette[i][0] & 0xff);
            const gdiff = (color[1] & 0xff) - (palette[i][1] & 0xff);
            const bdiff = (color[2] & 0xff) - (palette[i][2] & 0xff);
            const distanceSquared = rdiff * rdiff + gdiff * gdiff + bdiff * bdiff;
            if (distanceSquared < minDistanceSquared) {
            minDistanceSquared = distanceSquared;
            bestIndex = i;
            }
        }
        return palette[bestIndex];
    }

    function updatePixel(imageData, index, color) {
        imageData[index] = color[0];
        imageData[index + 1] = color[1];
        imageData[index + 2] = color[2];
        imageData[index + 3] = color[3];
    }

    function getColorErr(color1, color2, rate) {
        const res = [];
        for (let i = 0; i < 3; i++) {
            res.push(Math.floor((color1[i] - color2[i]) / rate));
        }
        return res;
    }

    function updatePixelErr(imageData, index, err, rate) {
        imageData[index] += err[0] * rate;
        imageData[index + 1] += err[1] * rate;
        imageData[index + 2] += err[2] * rate;
    }

    function ditheringCanvasByPalette(canvas, palette, type) {
        palette = palette || bwrPalette;

        const ctx = canvas.getContext('2d');
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const w = imageData.width;

        for (let currentPixel = 0; currentPixel <= imageData.data.length; currentPixel += 4) {
            const newColor = getNearColorV2(imageData.data.slice(currentPixel, currentPixel + 4), palette);

            if (type === 'bwr_floydsteinberg') {
                const err = getColorErr(imageData.data.slice(currentPixel, currentPixel + 4), newColor, 16);

                updatePixel(imageData.data, currentPixel, newColor);
                updatePixelErr(imageData.data, currentPixel + 4, err, 7);
                updatePixelErr(imageData.data, currentPixel + 4 * w - 4, err, 3);
                updatePixelErr(imageData.data, currentPixel + 4 * w, err, 5);
                updatePixelErr(imageData.data, currentPixel + 4 * w + 4, err, 1);
            } else {
                const err = getColorErr(imageData.data.slice(currentPixel, currentPixel + 4), newColor, 8);

                updatePixel(imageData.data, currentPixel, newColor);
                updatePixelErr(imageData.data, currentPixel + 4, err, 1);
                updatePixelErr(imageData.data, currentPixel + 8, err, 1);
                updatePixelErr(imageData.data, currentPixel + 4 * w - 4, err, 1);
                updatePixelErr(imageData.data, currentPixel + 4 * w, err, 1);
                updatePixelErr(imageData.data, currentPixel + 4 * w + 4, err, 1);
                updatePixelErr(imageData.data, currentPixel + 8 * w, err, 1);
            }
        }
        ctx.putImageData(imageData, 0, 0);
    }



    // --- Image region selection and dithering overlay logic (from image.html, adapted) ---
    const imgOverlayBg = document.getElementById('imgOverlayBg');
    const imgOverlay = document.getElementById('imgOverlay');
    const imgRegionContainer = document.getElementById('imgRegionContainer');
    const popupImage = document.getElementById('popupImage');
    const region = document.getElementById('region');
    const ditheredOverlay = document.getElementById('ditheredOverlay');
    const peerButtonsContainer = document.getElementById('peerButtonsContainer');
    // Dynamic slots obtained from /querySlots. Response returns highest index (e.g. "5" -> 5 4 3 2 1 0 profile)
    let slots = [];
    let slotsLoading = false; // prevent overlapping slot queries
    function querySlots(){
        if(slotsLoading) return Promise.resolve();
        slotsLoading = true;
        return fetch('/querySlots', { cache: 'no-store' })
          .then(r => r.text())
          .then(t => {
            const maxSlot = parseInt(t.trim(), 10);
            if(!Number.isFinite(maxSlot) || maxSlot < 0 || maxSlot > 512) {
              throw new Error('invalid slot value: ' + t);
            }
            const newSlots = [];
            // 1-based indexing: include maxSlot down to 1 (exclude 0)
            for(let i = maxSlot; i >= 1; i--) newSlots.push(i.toString());
            newSlots.push('profile');
            slots = newSlots;
            console.log('Slots updated:', slots.join(' '));
          })
          .catch(err => {
            console.error('Failed to query slots; using fallback 7..0 + profile', err);
            const fallback = [];
            // Fallback also 1-based (7..1)
            for(let i = 7; i >= 1; i--) fallback.push(i.toString());
            fallback.push('profile');
            slots = fallback;
          })
          .finally(() => {
            slotsLoading = false;
            if(imgOverlayBg.style.display === 'flex') createSlotButtons();
          });
    }
    
    let dragging = false, resizing = false, startX, startY, startLeft, startTop, startWidth, startHeight;
    let regionData = {left: 50, top: 50, width: 200, height: 150}; // default 4:3
    let imgRect = null;
    let lastTouchDist = null;
    
    // Function to create slot buttons
    function createSlotButtons() {
        if(slots.length === 0){
            return; // waiting for background querySlots
        }
        peerButtonsContainer.innerHTML = '';
        slots.forEach(slot => {
            const button = document.createElement('button');
            button.className = 'peer-btn';
            button.textContent = slot;
            button.addEventListener('click', () => sendToSlot(slot));
            peerButtonsContainer.appendChild(button);
        });
        // Position immediately if region visible and image loaded
        if (region.style.display === 'block' && popupImage.complete) {
            requestAnimationFrame(() => updateRegion());
        }
    }
    
    // Function to send image data to a specific slot
    function sendToSlot(slot) {
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 400; tempCanvas.height = 300;
        const tempCtx = tempCanvas.getContext('2d');
        const scaleX = popupImage.naturalWidth / popupImage.width;
        const scaleY = popupImage.naturalHeight / popupImage.height;
        const sx = regionData.left * scaleX;
        const sy = regionData.top * scaleY;
        const sw = regionData.width * scaleX;
        const sh = regionData.height * scaleY;
        tempCtx.save();
        tempCtx.translate(200, 150); // 4:3
        tempCtx.drawImage(popupImage, sx, sy, sw, sh, -200, -150, 400, 300);
        tempCtx.restore();
        dithering(tempCtx, 400, 300, 128, 3);
        const bytes = canvas2bytes(tempCanvas, 'bw');
        const byteArray = new Uint8Array(bytes);
        const blob = new Blob([byteArray], {type: 'application/octet-stream'});
        const formData = new FormData();
        formData.append('file', blob, 'image.bin');
        formData.append('slot', slot); // Add slot information
        
        const endpoint = `/file?slot=${encodeURIComponent(slot)}`;
        fetch(endpoint, { method: 'POST', body: formData })
            .then(response => {
                if (response.ok) {
                    console.log(`Image sent to slot ${slot} successfully`);
                } else {
                    console.error(`Failed to send image to slot ${slot}`);
                }
            })
            .catch(error => {
                console.error(`Error sending to slot ${slot}:`, error);
            });
        closeOverlay();
    }
    function handleImageFile(evt) {
        const [file] = evt.target.files;
        if (file) {
            popupImage.src = URL.createObjectURL(file);
            popupImage.style.display = 'block';
            imgOverlayBg.style.display = 'flex';
            
            // Create slot buttons when image is selected
            createSlotButtons();
            
            popupImage.onload = () => {
                // scale image by orientation to avoid stretching
                // also just max-heigth and max-width does not work since small images wont get scaled up to their max height/width
                // object-fit: contain does not work since the ditthering then for some reason uses a stretched version of the image.
                /*
                popupImage.style.removeProperty('max-width');
                popupImage.style.removeProperty('max-height');
                popupImage.style.removeProperty('width');
                popupImage.style.removeProperty('height');
                imgOverlay.style.removeProperty('max-width');
                imgOverlay.style.removeProperty('width');
                imgOverlay.style.removeProperty('height');
                imgOverlay.style.removeProperty('max-height');
                if (popupImage.naturalWidth >= popupImage.naturalHeight) {
                    popupImage.style.width = '70vw';
                    popupImage.style.maxHeight = '70vh';
                    imgOverlay.style.width = '70vw';
                    imgOverlay.style.maxHeight = '70vh';
                }
                if (popupImage.naturalWidth < popupImage.naturalHeight) {
                    popupImage.style.maxWidth = '70vw';
                    popupImage.style.height = '70vh';
                    imgOverlay.style.maxWidth = '70vw';
                    imgOverlay.style.height = '70vh';
                }
                */
                imgRect = popupImage.getBoundingClientRect();
                const iw = popupImage.width, ih = popupImage.height;
                let rw = iw * 0.5, rh = rw * 3/4;
                if (rh > ih) { rh = ih * 0.5; rw = rh * 4/3; }
                regionData = {
                    left: (iw - rw) / 2,
                    top: (ih - rh) / 2,
                    width: rw,
                    height: rh
                };
                region.style.display = 'block';
                ditheredOverlay.style.display = 'block';
                peerButtonsContainer.style.display = 'flex';
                updateRegion();
            };
        }
    }
    function updateRegion() {
        if (!popupImage.width || !popupImage.height) return;
        region.style.left = regionData.left + 'px';
        region.style.top = regionData.top + 'px';
        region.style.width = regionData.width + 'px';
        region.style.height = regionData.height + 'px';
        ditheredOverlay.style.left = regionData.left + 'px';
        ditheredOverlay.style.top = regionData.top + 'px';
        ditheredOverlay.width = 400;
        ditheredOverlay.height = 300;
        ditheredOverlay.style.width = regionData.width + 'px';
        ditheredOverlay.style.height = regionData.height + 'px';
        ditheredOverlay.style.display = 'block';
    // Position peer buttons container at top-right of region; buttons flow leftward
    peerButtonsContainer.style.display = 'flex';
    // Temporarily render to measure width
    peerButtonsContainer.style.visibility = 'hidden';
    peerButtonsContainer.style.left = '-9999px';
    peerButtonsContainer.style.top = '-9999px';
    // Force reflow
    void peerButtonsContainer.offsetWidth;
    // Measure total width of buttons
    let totalWidth = 0;
    Array.from(peerButtonsContainer.children).forEach(btn => { totalWidth += btn.getBoundingClientRect().width; });
    // Add gaps
    const gap = 0.35 * 16; // 0.35rem in px (approx)
    if(peerButtonsContainer.children.length > 1){ totalWidth += gap * (peerButtonsContainer.children.length - 1); }
    
    // Calculate ideal position (anchored to region's right edge)
    let idealLeftPos = regionData.left + regionData.width - totalWidth + 27;
    
    // Get the popup image's position relative to the viewport
    const imgRect = popupImage.getBoundingClientRect();
    const absoluteIdealLeft = imgRect.left + idealLeftPos;

    // Ensure buttons don't go off-screen on the left (10px buffer from browser window edge)
    const minAbsoluteLeft = 10;
    let finalAbsoluteLeft = Math.max(absoluteIdealLeft, minAbsoluteLeft);
    
    // Convert back to relative position within the image container
    let finalLeftPos = finalAbsoluteLeft - imgRect.left;
    
    peerButtonsContainer.style.left = finalLeftPos + 'px';
    peerButtonsContainer.style.top = regionData.top - 22 + 'px';
    peerButtonsContainer.style.visibility = 'visible';
        if (popupImage.src && popupImage.complete && regionData.width > 0 && regionData.height > 0) {
            const scaleX = popupImage.naturalWidth / popupImage.width;
            const scaleY = popupImage.naturalHeight / popupImage.height;
            const sx = regionData.left * scaleX;
            const sy = regionData.top * scaleY;
            const sw = regionData.width * scaleX;
            const sh = regionData.height * scaleY;
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 400; tempCanvas.height = 300;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(popupImage, sx, sy, sw, sh, 0, 0, 400, 300);
            dithering(tempCtx, 400, 300, 128, 3);
            const overlayCtx = ditheredOverlay.getContext('2d');
            overlayCtx.clearRect(0, 0, 400, 300);
            overlayCtx.drawImage(tempCanvas, 0, 0, 400, 300);
        }
    }
    region.addEventListener('mousedown', function(e) {
        dragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startLeft = regionData.left;
        startTop = regionData.top;
        document.body.style.userSelect = 'none';
    });
    document.addEventListener('mousemove', function(e) {
        if (dragging && imgOverlayBg.style.display === 'flex') {
            let dx = e.clientX - startX;
            let dy = e.clientY - startY;
            let newLeft = Math.max(0, Math.min(popupImage.width - regionData.width, startLeft + dx));
            let newTop = Math.max(0, Math.min(popupImage.height - regionData.height, startTop + dy));
            regionData.left = newLeft;
            regionData.top = newTop;
            updateRegion();
        }
    });
    document.addEventListener('mouseup', function() {
        dragging = false;
        document.body.style.userSelect = '';
    });
    region.addEventListener('wheel', function(e) {
        e.preventDefault();
        let scale = e.deltaY < 0 ? 1.05 : 0.95;
        if (e.ctrlKey) scale = e.deltaY < 0 ? 1.01 : 0.99;
        let newWidth = regionData.width * scale;
        let newHeight = newWidth * 3/4;
        // Clamp to image size
        if (newWidth < 40 || newHeight < 30) return;
        if (newWidth > popupImage.width) newWidth = popupImage.width, newHeight = newWidth * 3/4;
        if (newHeight > popupImage.height) newHeight = popupImage.height, newWidth = newHeight * 4/3;
        // Calculate center before scaling
        let centerX = regionData.left + regionData.width / 2;
        let centerY = regionData.top + regionData.height / 2;
        // Move region to keep it inside image after scaling
        let newLeft = centerX - newWidth / 2;
        let newTop = centerY - newHeight / 2;
        if (newLeft < 0) newLeft = 0;
        if (newTop < 0) newTop = 0;
        if (newLeft + newWidth > popupImage.width) newLeft = popupImage.width - newWidth;
        if (newTop + newHeight > popupImage.height) newTop = popupImage.height - newHeight;
        regionData.width = newWidth;
        regionData.height = newHeight;
        regionData.left = newLeft;
        regionData.top = newTop;
        updateRegion();
    });
    region.addEventListener('touchstart', function(e) {
        e.preventDefault();
        if (e.touches.length === 1) {
            dragging = true;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            startLeft = regionData.left;
            startTop = regionData.top;
        } else if (e.touches.length === 2) {
            resizing = true;
            lastTouchDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            startWidth = regionData.width;
            startHeight = regionData.height;
        }
    }, { passive: false });
    region.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (dragging && e.touches.length === 1) {
            let dx = e.touches[0].clientX - startX;
            let dy = e.touches[0].clientY - startY;
            let newLeft = Math.max(0, Math.min(popupImage.width - regionData.width, startLeft + dx));
            let newTop = Math.max(0, Math.min(popupImage.height - regionData.height, startTop + dy));
            regionData.left = newLeft;
            regionData.top = newTop;
            updateRegion();
        } else if (resizing && e.touches.length === 2) {
            let dist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            let scale = dist / lastTouchDist;
            let newWidth = startWidth * scale;
            let newHeight = newWidth * 3/4;
            if (newWidth < 40 || newHeight < 30) return;
            if (newWidth > popupImage.width) newWidth = popupImage.width, newHeight = newWidth * 3/4;
            if (newHeight > popupImage.height) newHeight = popupImage.height, newWidth = newHeight * 4/3;
            let centerX = regionData.left + regionData.width / 2;
            let centerY = regionData.top + regionData.height / 2;
            let newLeft = centerX - newWidth / 2;
            let newTop = centerY - newHeight / 2;
            if (newLeft < 0) newLeft = 0;
            if (newTop < 0) newTop = 0;
            if (newLeft + newWidth > popupImage.width) newLeft = popupImage.width - newWidth;
            if (newTop + newHeight > popupImage.height) newTop = popupImage.height - newHeight;
            regionData.width = newWidth;
            regionData.height = newHeight;
            regionData.left = newLeft;
            regionData.top = newTop;
            updateRegion();
        }
    }, { passive: false });
    region.addEventListener('touchend', function(e) {
        dragging = false;
        resizing = false;
        e.preventDefault();
    }, { passive: false });
    // Close overlay on click outside
    imgOverlayBg.addEventListener('mousedown', function(e) {
        if (e.target === imgOverlayBg) closeOverlay();
    });
    imgOverlayBg.addEventListener('touchstart', function(e) {
        if (e.target === imgOverlayBg) closeOverlay();
    });
    function closeOverlay() {
        imgOverlayBg.style.display = 'none';
        popupImage.src = '#';
        popupImage.style.display = 'none';
        region.style.display = 'none';
        ditheredOverlay.style.display = 'none';
        peerButtonsContainer.style.display = 'none';
    }
    </script>
